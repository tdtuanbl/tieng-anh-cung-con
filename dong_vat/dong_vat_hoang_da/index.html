  <link rel="stylesheet" href="../../shared/style.css" />

<body>
  <div class="container">
    <div class="top-nav">
      <a class="btn-home" href="../../index.html">🏠 Quay lại Trang chủ</a>
    </div>
    <header>
      <h1>🦁 Động Vật Hoang Dã & Rừng Xanh</h1>
      <p class="subtitle">Bấm vào từng con vật để nghe phát âm — Bố đọc cùng Đậu câu ngắn ở dưới nhé!</p>
    </header>

    <div class="controls">
      <button id="btnExplore" class="btn btn-mode active" onclick="switchMode('explore')">📖 Khám phá từ vựng</button>
      <button id="btnQuiz" class="btn btn-mode" onclick="switchMode('quiz')">🎯 Trò chơi tìm con vật</button>
      <button id="btnSpeed" class="btn btn-speed" onclick="toggleSpeed()">🐢 Tốc độ: Chậm cho Đậu</button>
    </div>

    <div id="explorePanel" class="grid"></div>

    <div id="quizPanel" class="quiz-panel">
      <div class="score-bar">
        <span>⭐ Điểm của Đậu: <span id="scoreValue">0</span></span>
        <span id="streakText">Cố lên nào!</span>
      </div>
      <div id="quizPrompt" class="quiz-prompt">Where is the ...?</div>
      <button class="btn btn-listen" onclick="repeatQuestion()">🔊 Nghe lại câu hỏi</button>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="quizFeedback" class="quiz-feedback"></div>
    </div>

    <div class="tip-footer">
      💡 <b>Mẹo cho bố:</b> Bấm vào thẻ để nghe tên con vật; bấm vào khung màu xanh ở dưới mỗi thẻ để nghe câu giao tiếp
      ngắn.
    </div>
  </div>
